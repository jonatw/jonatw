<text x="40" y="144" font-size="12" fill="#8b949e" font-family="Segoe UI,Helvetica,Arial,sans-serif">authored by me</text>
<text x="164" y="112" font-size="13" fill="#c9d1d9" font-family="Segoe UI,Helvetica,Arial,sans-serif">58% of it written pairing with Claude —</text>
<text x="164" y="132" font-size="13" fill="#c9d1d9" font-family="Segoe UI,Helvetica,Arial,sans-serif">my hands on the controls, every turn.</text>

<text x="470" y="122" font-size="40" font-weight="700" fill="#a371f7" font-family="Segoe UI,Helvetica,Arial,sans-serif">31%</text>
<text x="470" y="144" font-size="12" fill="#8b949e" font-family="Segoe UI,Helvetica,Arial,sans-serif">shipped by the fleet</text>
<text x="470" y="162" font-size="11" fill="#6e7681" font-family="Segoe UI,Helvetica,Arial,sans-serif">autonomous — I review and merge</text>

