<text x="40" y="478" font-size="10" fill="#6e7681" font-family="Segoe UI,Helvetica,Arial,sans-serif">PRs and issues show who opened them — GitHub records no pairing there.</text><text x="40" y="492" font-size="10" fill="#6e7681" font-family="Segoe UI,Helvetica,Arial,sans-serif">The fleet opens most of the tickets; it writes a smaller share of the code.</text><text x="40" y="506" font-size="10" fill="#6e7681" font-family="Segoe UI,Helvetica,Arial,sans-serif">Line counts exclude lockfiles, vendored trees, generated reports and committed data.</text>
