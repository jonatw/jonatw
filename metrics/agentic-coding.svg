<svg width="760" height="528" viewBox="0 0 760 528" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Who ships the code — 63% of commits authored by me, 31% shipped autonomously by my agent fleet">
<rect x="0.5" y="0.5" width="759" height="527" rx="10" fill="#0d1117" stroke="#30363d"/>
<text x="40" y="42" font-size="18" font-weight="600" fill="#e6edf3" font-family="Segoe UI,Helvetica,Arial,sans-serif">Who ships the code</text>
<text x="40" y="62" font-size="11" fill="#8b949e" font-family="Segoe UI,Helvetica,Arial,sans-serif">last 90 days · every repo I own, public and private · 2,000 commits</text>

