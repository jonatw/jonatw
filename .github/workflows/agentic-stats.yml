name: agentic-stats
on:
  schedule:
    - cron: "37 20 * * *"   # 每天 04:37 台北（避開整點，schedule 尖峰會被延遲）
  workflow_dispatch:
permissions:
  contents: write

# 一次只跑一個：兩個 run 疊在一起會撞 push（後者 non-fast-forward）
concurrency:
  group: agentic-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # v7 以下的 action 宣告 node20，runner 已淘汰 node20 會強制改跑 node24 並警告。
      # checkout v7 的 persist-credentials 預設仍是 true，下面的 git push 照常可用。
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "24" }

      - name: Fail fast if the stats token is missing
        # 沒有這關的話，token 過期時腳本只會靜默產出「0 commits」並照樣 commit，
        # 圖表歸零卻沒人發現。
        run: test -n "${{ secrets.STATS_TOKEN }}" || { echo "STATS_TOKEN is unset or expired"; exit 1; }

      - name: Regenerate stats
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}   # 唯讀 PAT，讀得到 private
        run: node scripts/agentic-stats.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          FILES="metrics/agentic-coding.svg metrics/agentic-coding.json metrics/commit-churn-cache.json"

          for i in 1 2 3; do
            git add $FILES
            if git diff --staged --quiet; then
              echo "no change"
              exit 0
            fi
            git commit -q -m "chore: refresh agentic-coding stats"
            if git push -q; then
              echo "pushed on attempt $i"
              exit 0
            fi

            # 被另一個 run 搶先推了。這三個檔案是「計算輸出」不是人寫的內容，
            # 兩個 run 各自重算必然整檔重疊 —— rebase 一定在每個檔案衝突並卡住
            # (2026-08-01 實測就是這樣掛的)。輸出沒有合併語意，最新一次計算為準：
            # 把 HEAD 對齊 remote、保留本次產生的內容(--soft 留住 index)重新 commit。
            echo "push rejected; realigning onto remote (attempt $i)"
            git fetch -q origin "${GITHUB_REF_NAME}"
            git reset -q --soft "origin/${GITHUB_REF_NAME}"
          done

          echo "push failed after 3 attempts"
          exit 1
